# Rule-based triage of new and edited issues: labels the issue by its form, checks that the required fields are filled
# in, and keeps one comment with the checks that fit the problem (.github/scripts/triage.js). No model and no secret.
name: Issue triage

on:
  issues:
    types: [opened, edited, reopened]

permissions: {}

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3   # v9.0.0
        with:
          script: |
            const triage = require('./.github/scripts/triage.js');
            await triage({ github, context });
